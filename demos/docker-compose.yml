# Shared services every session can rely on being there. A session that
# needs something extra (PostgreSQL in Session 5, for example) adds its
# own docker-compose.yml in its own folder; run both together:
#   docker compose -f docker-compose.yml -f session-05-integration/docker-compose.yml up -d

services:
  fuseki:
    # Built from Apache's own Fuseki 5.5.0 release, see fuseki/Dockerfile.
    # (Replaced the unmaintained stain/jena-fuseki image, 2026-09-24.)
    build: ./fuseki
    image: kr-fuseki:5.5.0
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - fuseki-data:/data

  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/kr-labs-pw
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  fuseki-data:
  neo4j-data:
