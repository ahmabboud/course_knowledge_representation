# Session 5: the "live operational database", an empty PostgreSQL 16.
# From this folder:
#   docker compose up -d
# Then python load_database.py creates the four Brunel tables and loads them.
# The database answers on this computer only (127.0.0.1), user kr,
# password kr-labs-pw, database brunel.
#
# The volume name is new on purpose (2026-09-25): an older course volume
# holds a database called dataco, and PostgreSQL only creates POSTGRES_DB
# the first time a volume is used.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=kr
      - POSTGRES_PASSWORD=kr-labs-pw
      - POSTGRES_DB=brunel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-brunel:/var/lib/postgresql/data

volumes:
  postgres-brunel:
