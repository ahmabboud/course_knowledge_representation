# Morph-KGC config for the materialize path. Run from this folder:
#   python3 -m morph_kgc config_materialize.ini
# Produces materialized.nt (Morph-KGC appends .nt for N-TRIPLES output
# regardless of the extension given here), the graph Session 4's
# shapes validate against (see compare_materialize_vs_virtualize.md
# and ../session-04-shacl/shapes_template.ttl).
[CONFIGURATION]
output_file: materialized
output_format: N-TRIPLES
na_values: ,#N/A,N/A

[DataSource1]
mappings: mapping_template.rml.ttl
db_url: postgresql://kr:kr-labs-pw@localhost:5432/dataco
